# GoReleaser configuration (v2 schema)
# Docs: https://goreleaser.com
version: 2

project_name: fuse

before:
  hooks:
    - go mod tidy

builds:
  - id: orchestrator
    main: ./orchestrator
    binary: orchestrator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # main.version is stamped here (declared as `var version = "dev"` in package
    # main); `fused --version` / `orchestrator --version` report the release tag,
    # which the self-host updater (host-agent/firecracker/fc-update.sh) compares against GitHub.
    ldflags:
      - -s -w -X main.version={{.Version}}

  # fused: the reference in-guest agent baked into the microVM rootfs (or fetched
  # at boot via AGENT_DOWNLOAD_URL / start-agent download_url). Linux only — it
  # runs inside a Firecracker guest, never on the control-plane host.
  - id: fused
    main: ./fused
    binary: fused
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: fuse-cli
    main: ./cli
    binary: fuse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # Control-plane archive (orchestrator) as a tarball.
  - id: default
    ids:
      - orchestrator
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: README.md
      # LICENSE* / CHANGELOG* are included automatically by goreleaser.
      - src: LICENSE*

  # fused as a raw, directly-downloadable binary asset, so AGENT_DOWNLOAD_URL and
  # the self-host updater can fetch it without unpacking a tarball, e.g.
  #   https://github.com/folsomintel/fuse/releases/download/<tag>/fused_Linux_x86_64
  - id: fused
    ids:
      - fused
    formats:
      - binary
    name_template: >-
      fused_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

  - id: cli
    ids:
      - fuse-cli
    formats:
      - tar.gz
    name_template: >-
      fuse-cli_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

# Developer ID signing + Apple notarization for the darwin CLI binaries.
# `notarize.macos` is OSS (only the sibling `macos_native` key is Pro), and it
# runs on linux: goreleaser signs with quill in pure Go and submits over the
# App Store Connect REST API, so no macOS runner and no Xcode are needed.
#
# Inert until MACOS_SIGN_P12 is set, so forks and unsigned tags still release.
# `ids` MUST be listed: it defaults to the project name (`fuse`), which is not
# a build id here, and a mismatch skips signing with only a WARN.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - fuse-cli
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: fuse
    ids:
      - cli
    binaries:
      - fuse
    repository:
      owner: folsomintel
      name: homebrew-fuse
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/folsomintel/fuse"
    description: "Operator CLI for the Fuse microVM control plane"
    # Go only ad-hoc/linker-signs the binary (Identifier=a.out, no team id), and
    # brew stamps com.apple.quarantine on cask downloads, so Gatekeeper's
    # first-launch check SIGKILLs it. Stripping the xattr is the stopgap until
    # the notarize block above is live; delete this once a notarized tag ships.
    # Must be `-dr`, not `-d`: xattr exits 1 when the attribute is absent and
    # system_command runs with must_succeed, which would abort the install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fuse"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT"

changelog:
  disable: true

release:
  github:
    owner: folsomintel
    name: fuse
  # release-please already created the release + notes for this tag; attach
  # artifacts to it instead of creating a second release.
  mode: keep-existing
