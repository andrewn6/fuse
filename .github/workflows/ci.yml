name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN. Every job here only checks out
# the repo and runs build/test/lint, so read access to contents is enough. A job
# that needs more should raise it with its own narrower `permissions:` block.
permissions:
  contents: read

# Cancel in-progress runs for the same ref when a new run is triggered,
# so superseded commits/PR updates don't waste CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Track the version pinned in go.mod so CI stays in sync with the module.
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          # Print any unformatted files first for debuggability, then fail if any exist.
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

  # Blocking vulnerability scan. govulncheck reports only vulnerabilities on
  # call paths the binaries actually reach, so a finding here is real and must
  # be fixed (dependency bump, or a Go toolchain bump for stdlib findings)
  # rather than triaged away. It reads the toolchain from go.mod, so the stdlib
  # it scans is the stdlib we ship.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan root module
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Scan Go SDK module
        working-directory: sdks/go
        env:
          GOWORK: "off"
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Blocking lint. The repo is golangci-lint-clean under the pinned version +
  # .golangci.yml config; keep the version pinned so a new golangci-lint release
  # can't fail CI out from under a green PR.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # CLI installer script. Runs against a fake release served by a stubbed curl,
  # so it needs no network and no published tag: it covers the platform ->
  # goreleaser-asset-name mapping and the fail-closed checksum handling.
  install-script:
    name: Install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install-fuse tests
        run: ./ops/test-install-fuse.sh

  # Installer/updater shell tests. The release-asset checksum helper is embedded
  # in two standalone scripts rather than sourced, so this job is what keeps the
  # copies from drifting apart.
  installer-tests:
    name: Installer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checksum verification tests
        run: ./host-agent/firecracker/test-verify-checksum.sh

  # Validate the GoReleaser config on every PR so a CD-breaking change is caught
  # here instead of only when a release tag is pushed.
  release-config:
    name: Release config check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # TypeScript SDK (sdks/typescript): lint, typecheck, test, and build. Runs in
  # parallel with the Go jobs and is independent of them.
  sdk-ts:
    name: TS SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Python SDK (sdks/python): lint, typecheck, test via uv. Independent of the
  # Go and TS jobs.
  sdk-py:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest

  # Host agents: stdlib-only unittest suites that need no VMs or virtualization,
  # so they run here and keep the image path-containment and public-host
  # composition regressions from silently rotting. Scoped to these files:
  # test_fc_agent_attach.py drives a real pty/ssh relay and does not pass in a
  # bare runner.
  host-agent:
    name: Host agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test QEMU agent
        working-directory: host-agent/qemu
        run: python -m unittest test_qemu_agent -v
      - name: Test Firecracker agent
        working-directory: host-agent/firecracker
        run: python -m unittest test_fc_agent_public_host -v

  # Rust SDK (sdks/rust): fmt, clippy, test. Independent of the Go, TS, and
  # Python jobs.
  sdk-rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # Go SDK as a standalone module: builds with GOWORK=off so the workspace does
  # not mask a missing/extra dependency a real consumer would hit.
  sdk-go:
    name: Go SDK
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The repo toolchain from the root go.mod, not sdks/go's own `go`
          # directive: that directive is the *floor* we promise consumers and
          # deliberately stays low, but CI must not compile and test against a
          # stdlib carrying known vulnerabilities.
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1
