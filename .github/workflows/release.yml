name: Release

# Two halves, split by ref:
#  - release-please runs on push to main: it maintains the "chore: release main"
#    PR and, when that PR merges, creates the vX.Y.Z tag + GitHub release.
#  - the publish jobs run on a pushed v*.*.* tag (whether release-please created
#    it or you pushed one by hand). the tag is the single source of truth for
#    "publish this version", so a release-please hiccup can never silently
#    publish nothing, and you always have a manual escape hatch.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialise: two pushes to main in quick succession (a feature PR and the
    # release PR right behind it) otherwise start overlapping runs that race on
    # the same release PR. Never cancel in progress, cancelling mid-release is
    # how a half-tagged state happens in the first place.
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    steps:
      # a PAT (or the release-please app) is required so the release PR triggers
      # ci.yml; the default GITHUB_TOKEN would not trigger downstream workflows.
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Backstop for release-please's release phase, which intermittently merges the
  # release PR without ever creating the tag. That leaves the PR labelled
  # `autorelease: pending`, and every later run aborts with "There are untagged,
  # merged release PRs outstanding" until someone tags by hand.
  #
  # The manifest version on main is the source of truth for "what should be
  # released": it only changes when a release PR merges. So if that version has
  # no tag, cut one. The tag-triggered publish jobs below then run exactly as
  # they would have, and relabelling the merged release PR unblocks
  # release-please for the next cycle.
  #
  # Idempotent: when release-please does its job, the tag already exists and
  # this is a no-op.
  tag-backstop:
    needs: release-please
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main-backstop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT, not GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN does not
          # trigger workflows, so the publish half of this file would never fire.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Tag the manifest version when it is untagged
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          V="$(jq -r '.["."] // empty' .release-please-manifest.json)"
          if [ -z "${V}" ]; then
            echo "no version in .release-please-manifest.json; nothing to do"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v${V}" >/dev/null; then
            echo "v${V} is already tagged; release-please did its job"
            exit 0
          fi

          echo "manifest is at ${V} with no v${V} tag; cutting it"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${V}" -m "v${V}"
          git push origin "v${V}"

          # The docs /changelog page renders GitHub release bodies, not
          # CHANGELOG.md, so a bare tag would leave that version blank. Lift this
          # version's section out of the changelog release-please just wrote.
          NOTES="$(awk -v v="v${V}" '
            index($0, "## [" substr(v,2) "]") == 1 || index($0, "## " substr(v,2)) == 1 { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md)"
          if [ -n "${NOTES//[$'\n\t ']/}" ]; then
            printf '%s\n' "${NOTES}" | gh release create "v${V}" --title "v${V}" --notes-file -
          else
            gh release create "v${V}" --title "v${V}" --generate-notes
          fi

      # Its own step, and `always()`, because the tagging step above returns
      # early on two paths that both leave a merged release PR sitting at
      # `autorelease: pending`: no version in the manifest, and "already
      # tagged". That second one is the common case. release-please usually
      # tags correctly and just does not move the label, and a stale label is
      # on its own enough to abort EVERY later run with "untagged, merged
      # release PRs outstanding" while reporting success and creating no PR.
      # The release that gets blocked is never the one being cut here, so this
      # has to run whether or not this job had anything to tag.
      - name: Clear the release PR label that blocks the next cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PENDING: "autorelease: pending"
          TAGGED: "autorelease: tagged"
        run: |
          set -euo pipefail

          # REST, not `gh pr list`/`gh pr edit`. Those go through GraphQL, which
          # resolves author/org fields and so demands `read:org`; the token here
          # is a classic repo-scope PAT, because the org is on the free plan and
          # fine-grained tokens cannot write to it. The GraphQL calls failed with
          # "the 'login' field requires ['read:org']" and took the whole job down
          # AFTER the release had been cut successfully, which is the worst
          # possible place to fail: a red job and a shipped release.
          # The issues endpoint serves pull requests too and needs only `repo`.
          PR="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/issues" \
                  -f state=closed -f "labels=${PENDING}" -f per_page=20 \
                  --jq '[.[] | select(.pull_request != null)][0].number // empty')"

          if [ -z "${PR}" ]; then
            echo "no merged release PR left at '${PENDING}'; nothing to clear"
            exit 0
          fi

          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" \
            -f "labels[]=${TAGGED}" >/dev/null
          # The label name contains a space, so it is percent-encoded into the
          # path rather than interpolated raw.
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/${PENDING// /%20}" >/dev/null
          echo "relabelled release PR #${PR} as '${TAGGED}'"

  # full gate, run on the pushed tag (race detector + all linters) before any publish.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: TS SDK checks
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
      - name: Go SDK module checks
        working-directory: sdks/go
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -count=1
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Python SDK checks
        working-directory: sdks/python
        run: |
          uv sync
          uv run ruff check src tests
          uv run mypy
          uv run pytest

  binaries:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # apple developer id signing + notarization. unset until an apple
          # developer program membership exists; goreleaser skips the notarize
          # pipe when MACOS_SIGN_P12 is empty. see .goreleaser.yaml `notarize`.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  publish-npm:
    name: Publish TS SDK to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # oidc: npm trusted publishing + provenance
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # the tagged commit already carries the right version in package.json.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # oidc: pypi trusted publishing
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # the tagged commit already carries the right version in pyproject.toml.
      - run: uv build
      - run: uv publish

  tag-go-sdk:
    name: Tag Go SDK module
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # nested go module needs a path-prefixed tag for the proxy, kept in lockstep
      # with the unified version. derive it from the pushed tag (vX.Y.Z -> X.Y.Z).
      - name: Push lockstep module tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="${REF_NAME#v}"
          if [ -z "${V}" ]; then echo "version is empty; refusing to tag" >&2; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "sdks/go/v${V}"
          git push origin "sdks/go/v${V}"
      - uses: actions/setup-go@v5
        with:
          # Repo toolchain, not sdks/go's consumer floor. See the sdk-go job in
          # ci.yml for why.
          go-version-file: go.mod
      - name: Warm the module proxy
        env:
          REF_NAME: ${{ github.ref_name }}
          GOPROXY: proxy.golang.org
        run: |
          V="${REF_NAME#v}"
          go list -m "github.com/folsomintel/fuse/sdks/go@v${V}" || true
